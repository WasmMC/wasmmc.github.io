<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WasmMC</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg:#0c0c0f; --surface:#13131a; --surface2:#1a1a24;
  --border:#252535; --border2:#2e2e42;
  --accent:#7c6af7; --accent-dim:rgba(124,106,247,0.15);
  --accent2:#4fd1c5; --accent2-dim:rgba(79,209,197,0.12);
  --text:#dddde8; --text2:#9898aa; --muted:#55555f;
  --error:#f87171; --success:#4ade80; --warn:#facc15; --zero:#f87171;
  --col-addr:#888899; --col-bytes:#4fd1c5; --col-mnem:#b09aff;
  --col-ops:#dddde8; --col-pseudo:#f87171;
  --panel-title-main:#c8c8d8; --panel-title-sub:#55555f;
  --site-mc:#afa5ff;
  --mono:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --radius:8px; --radius-sm:5px;
}
[data-theme="light"] {
  --bg:#f2f2f7; --surface:#ffffff; --surface2:#e8e8f0;
  --border:#d0d0de; --border2:#b8b8cc;
  --accent:#5b4de0; --accent-dim:rgba(91,77,224,0.1);
  --accent2:#0e9488; --accent2-dim:rgba(14,148,136,0.1);
  --text:#1a1a2e; --text2:#4a4a62; --muted:#8888a0;
  --error:#cc2222; --success:#1a7f3c; --warn:#a07000; --zero:#cc2222;
  --col-addr:#5a5a7a; --col-bytes:#0e7a70; --col-mnem:#5b4de0;
  --col-ops:#1a1a2e; --col-pseudo:#cc2222;
  --panel-title-main:#1a1a2e; --panel-title-sub:#8888a0;
  --site-mc:#796be8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;line-height:1.5;transition:background .2s,color .2s}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.drag-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:9999;align-items:center;justify-content:center;font-size:24px;font-weight:600;color:#fff;pointer-events:none;backdrop-filter:blur(2px)}
body.is-dragging .drag-overlay{display:flex}
.page{max-width:2330px;margin:0 auto;padding:22px 75px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.topbar-left{display:flex;align-items:center;gap:12px;flex-shrink:0}
.site-brand{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.topbar-right{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.status-pill,.live-toggle,.icon-btn,.theme-btn{height:26px;box-sizing:border-box}
.site-title{font-size:17px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.site-name-wasm{color:var(--accent)}.site-name-mc{color:var(--site-mc)}
.site-tagline{font-size:10px;color:var(--muted);letter-spacing:.15px;white-space:nowrap;margin-top:3px}
.status-pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 11px;font-size:11px;font-family:var(--mono);color:var(--text2);transition:border-color .2s,color .2s;cursor:default;position:relative;user-select:none}
.status-pill.ok{border-color:rgba(74,222,128,.45);color:var(--success)}
.status-pill.err{border-color:rgba(248,113,113,.45);color:var(--error)}
.status-pill.loading{border-color:rgba(250,204,21,.45);color:var(--warn)}
.pill-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.loading .pill-dot{animation:blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.status-pill .ptip{display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:11px;font-family:var(--mono);color:var(--text);padding:5px 9px;white-space:nowrap;z-index:100;pointer-events:none}
.status-pill:hover .ptip{display:block}
.icon-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;color:var(--text2);display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;padding:0 9px;font-size:12px;gap:5px;white-space:nowrap}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn svg{flex-shrink:0}
.theme-btn{background:none;border:none;cursor:pointer;color:var(--text2);padding:0 4px;border-radius:4px;display:flex;align-items:center;justify-content:center;transition:color .15s}
.theme-btn:hover{color:var(--accent)}
.live-toggle{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:0 11px;font-size:11px;cursor:pointer;user-select:none;color:var(--text2);transition:all .15s;font-family:var(--mono)}
.live-toggle.active{border-color:rgba(74,222,128,.5);color:var(--success);background:rgba(74,222,128,.07)}
.live-pulse{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0}
.live-toggle.active .live-pulse{background:var(--success);animation:blink 1s infinite}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.layout-control{display:inline-flex;align-items:center;height:27px}
.layout-choice{width:28px;height:27px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);border-radius:0;color:var(--muted);cursor:pointer;padding:0;transition:all .15s;margin-left:-1px}
.layout-choice:first-child{margin-left:0;border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
.layout-choice:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.layout-choice:hover{color:var(--text);border-color:var(--border2);position:relative;z-index:1}
.layout-choice.active{color:var(--accent);border-color:var(--accent);background:rgba(56,189,248,.07);position:relative;z-index:2}
.add-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);cursor:pointer;font-size:12px;padding:0 12px;transition:all .15s;white-space:nowrap}
.add-btn:hover{border-color:var(--accent);color:var(--accent)}
.panel-grid{display:flex;flex-wrap:wrap;gap:14px;align-items:start}
.panel-grid.layout-auto  .panel-wrap{flex:1 1 480px;min-width:0}
.panel-grid.layout-stack .panel-wrap{flex:1 1 100%;min-width:0}
.panel-grid.layout-side  .panel-wrap{flex:1 1 calc(50% - 7px);min-width:0}
.panel-wrap{animation:slideIn .2s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.panel-wrap.closing{animation:slideOut .17s ease-in forwards;pointer-events:none}
@keyframes slideOut{from{opacity:1;max-height:900px;margin-bottom:0}to{opacity:0;max-height:0;margin-bottom:-14px}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.panel-header{border-radius:var(--radius) var(--radius) 0 0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface2);gap:8px}
.panel-title{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.panel-title-main{color:var(--panel-title-main)}.panel-title-sub{color:var(--panel-title-sub);letter-spacing:.8px}.panel-title-sub:empty{display:none}
.close-btn{width:20px;height:20px;border-radius:4px;background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0}
.close-btn:hover{background:rgba(248,113,113,.12);border-color:var(--error);color:var(--error)}
.panel-body{padding:13px 15px 15px}
.asm-textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--mono);font-size:12.5px;line-height:1.65;padding:10px 12px;resize:vertical;min-height:110px;outline:none;transition:border-color .15s;tab-size:4}
.asm-textarea:focus{border-color:var(--accent)}
[data-theme="light"] .asm-textarea{background:var(--surface2)}
.arch-row{display:flex;flex-wrap:wrap;gap:4px;margin:11px 0 0}
.arch-btn{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);cursor:pointer;font-family:var(--mono);font-size:11px;padding:4px 9px;transition:all .12s;white-space:nowrap;flex-shrink:0}
.arch-btn:hover{border-color:var(--border2);color:var(--text)}
.arch-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:600}
[data-theme="light"] .arch-btn{background:var(--surface2)}
/* Options panel, shown or hidden per architecture */
.arch-opts{margin-top:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm)}
[data-theme="light"] .arch-opts{background:var(--surface2)}
.opts-section{margin-bottom:8px}
.opts-section:last-child{margin-bottom:0}
.opts-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.opts-label{font-size:11px;color:var(--muted);margin-right:2px;white-space:nowrap;min-width:60px}
.tog-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);cursor:pointer;font-size:11px;padding:3px 9px;transition:all .12s;white-space:nowrap;font-family:var(--mono)}
.tog-btn:hover{border-color:var(--border2);color:var(--text)}
.tog-btn.active{background:var(--accent2-dim);border-color:var(--accent2);color:var(--accent2)}
.tog-btn:disabled{opacity:.3;cursor:not-allowed;pointer-events:none}
[data-theme="light"] .tog-btn{background:var(--surface)}
/* CPU select */
.cpu-select{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);font-family:var(--mono);font-size:11px;padding:3px 6px;cursor:pointer;max-width:180px}
.cpu-select:focus{outline:none;border-color:var(--accent)}
/* Feature chips */
.feat-chip{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);cursor:pointer;font-size:10px;padding:2px 7px;transition:all .12s;white-space:nowrap;font-family:var(--mono)}
.feat-chip:hover{border-color:var(--border2);color:var(--text)}
.feat-chip.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.feat-chips{display:flex;flex-wrap:wrap;gap:3px}
.catalog-features{max-height:150px;overflow:auto;padding-right:4px}
.baddr-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.baddr-label{font-size:11px;color:var(--muted);white-space:nowrap}
.baddr-input{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--mono);font-size:11px;padding:3px 8px;width:140px;outline:none;transition:border-color .15s}
.baddr-input:focus{border-color:var(--accent)}
[data-theme="light"] .baddr-input{background:var(--surface2)}
.run-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);border:none;border-radius:var(--radius-sm);color:#fff;cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:600;width:140px;height:30px;margin-top:12px;flex-shrink:0;transition:opacity .15s,transform .1s;white-space:nowrap}
.run-btn:hover:not(:disabled){opacity:.85}.run-btn:active:not(:disabled){transform:scale(.97)}.run-btn:disabled{opacity:.35;cursor:not-allowed}
.output-section{margin-top:14px}
.output-tabs{display:flex;gap:3px;flex-wrap:wrap}
.out-tab{background:var(--surface);border:1px solid var(--border);border-bottom:none;border-radius:var(--radius-sm) var(--radius-sm) 0 0;color:var(--muted);cursor:pointer;font-size:11px;padding:4px 10px;transition:all .12s;font-family:var(--mono);position:relative}
.out-tab:hover{color:var(--text2);border-color:var(--border2)}.out-tab.active{background:var(--surface2);border-color:var(--border2);color:var(--text)}
.out-tab .tabtip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:10px;font-family:var(--sans);color:var(--text2);padding:3px 7px;white-space:nowrap;z-index:100;pointer-events:none}
.out-tab.active:hover .tabtip{display:block}
.output-box{background:var(--surface2);border:1px solid var(--border2);border-radius:0 var(--radius-sm) var(--radius-sm) var(--radius-sm);font-family:var(--mono);font-size:12px;line-height:1.7;padding:10px 13px;min-height:58px;white-space:pre-wrap;word-break:break-all;color:var(--success);position:relative;overflow-x:auto}
.output-box.is-error{color:var(--error)}.output-box.is-empty{color:var(--muted);font-style:italic;font-family:var(--sans)}
.zero-byte{color:var(--zero);font-weight:700}
.dis-table{border-collapse:collapse;width:100%}.dis-table td{padding:1px 0;vertical-align:top}
.col-addr{color:var(--col-addr);padding-right:14px;white-space:nowrap;user-select:none}
.col-bytes{color:var(--col-bytes);padding-right:14px;white-space:nowrap;min-width:100px}
.col-mnem{color:var(--col-mnem);padding-right:8px;white-space:nowrap}.col-ops{color:var(--col-ops)}
.row-pseudo .col-mnem{color:var(--col-pseudo)}.row-pseudo .col-bytes{opacity:.55}
.copy-btn{position:absolute;top:7px;right:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);cursor:pointer;font-size:10px;padding:2px 7px;opacity:0;transition:opacity .15s,color .15s;font-family:var(--sans)}
.output-box:hover .copy-btn{opacity:1}.copy-btn:hover{color:var(--accent);border-color:var(--accent)}
.stat-line{font-size:11px;color:var(--muted);margin-top:6px;font-family:var(--mono)}
.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:48px;padding-bottom:22px;line-height:2;display:flex;flex-direction:column;align-items:center;gap:8px}
.footer a{color:inherit;text-decoration:none}.footer a:hover{color:var(--accent2);text-decoration:underline}
.footer-actions{display:flex;align-items:center;gap:8px}
.footer-btn{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--muted);cursor:pointer;font-size:12px;padding:0 12px;transition:all .15s;white-space:nowrap}
.add-btn,.footer-btn{box-sizing:border-box;height:27px;line-height:1;font-family:var(--sans)}
.footer-btn:hover{border-color:var(--accent2);color:var(--accent2)}
@media (max-width:700px){
  .page{padding:16px 12px 42px}
  .topbar{align-items:flex-start;flex-wrap:wrap}
  .topbar-right{justify-content:flex-start}
  .site-tagline{white-space:normal}
}
</style>
</head>
<body>
<div class="drag-overlay">Drop binary to disassemble (Max 500KB)</div>
<div class="page">
  <div class="topbar">
    <div class="topbar-left">
      <div class="site-brand">
        <span class="site-title" id="site-name" aria-label="WasmMC"><span class="site-name-wasm">Wasm</span><span class="site-name-mc">MC</span></span>
        <span class="site-tagline" id="site-tagline">LLVM Machine Code Playground in the Browser</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="status-pill loading" id="llvm-pill">
        <span class="pill-dot"></span><span id="llvm-txt">LLVM MC</span>
        <span class="ptip" id="llvm-tip">Loading...</span>
      </span>
      <button class="live-toggle" id="live-btn" title="Auto (dis)assemble">
        <span class="live-pulse"></span>Live
      </button>
      <button class="icon-btn" id="share-btn" title="Copy state to shareable URL">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg><span>Share</span>
      </button>
      <button class="theme-btn" id="theme-btn" title="Switch theme" aria-label="Switch theme">
        <svg id="theme-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg>
      </button>
    </div>
  </div>
  <div class="toolbar">
    <div class="layout-control" role="group" aria-label="Panel layout">
      <button class="layout-choice" data-layout="auto" title="Automatic responsive layout" aria-label="Automatic responsive layout">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
      </button>
      <button class="layout-choice" data-layout="side" title="Side-by-side layout" aria-label="Side-by-side layout">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="14" rx="1"/><rect x="9" y="1" width="6" height="14" rx="1"/></svg>
      </button>
      <button class="layout-choice" data-layout="stack" title="Stacked layout" aria-label="Stacked layout">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="14" height="6" rx="1"/><rect x="1" y="9" width="14" height="6" rx="1"/></svg>
      </button>
    </div>
    <button class="add-btn" onclick="addPanel('asm')">
      <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="6" y1="1" x2="6" y2="11"/><line x1="1" y1="6" x2="11" y2="6"/></svg>Add Assembler
    </button>
    <button class="add-btn" onclick="addPanel('dis')">
      <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="6" y1="1" x2="6" y2="11"/><line x1="1" y1="6" x2="11" y2="6"/></svg>Add Disassembler
    </button>
    <div class="footer-actions">
      <button class="footer-btn" id="backend-status-btn" title="Click to unload idle modules">Modules: 0</button>
      <button class="footer-btn" id="remember-btn">Remember workspace: off</button>
      <button class="footer-btn" id="clear-data-btn" style="display:none">clear saved data</button>
    </div>
  </div>
  <div class="panel-grid layout-auto" id="panel-grid"></div>
</div>
<div class="footer">
  <span id="site-footer">© 2026 WasmMC · LLVM MC 22 WASM · hack the planet</span>
  <a href="THIRD_PARTY_NOTICES.md" target="_blank" rel="license noopener">licenses and notices</a>
</div>

<script src="backend-manager.js"></script>
<script src="app.js"></script>

</body>
</html>
